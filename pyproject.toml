[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-photon-mei"
version = "0.1.0"
description = "Offline two-stage encoding and MEI workflow for pooled single-photon responses"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "pandas==2.2.3",
  "h5py==3.14.0",
  "Pillow==11.0.0",
  "matplotlib==3.10.3",
  "scikit-learn==1.6.1",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "timm==1.0.15",
  "diffusers==0.33.1",
  "transformers==4.52.3",
  "accelerate==1.8.1",
  "safetensors==0.5.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
single-photon-mei = "single_photon_mei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
